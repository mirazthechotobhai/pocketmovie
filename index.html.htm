  <script type="module">
import { createHotContext } from "/@vite/client";
const hot = createHotContext("/__dummy__runtime-error-plugin");

function sendError(error) {
  if (!(error instanceof Error)) {
    error = new Error("(unknown runtime error)");
  }
  const serialized = {
    message: error.message,
    stack: error.stack,
  };
  hot.send("runtime-error-plugin:error", serialized);
}

// Only notify the parent frame after the server confirms the error passed
// the filter and the overlay will be shown.
hot.on("runtime-error-plugin:notify-parent", () => {
  try {
    window.parent.postMessage({ type: "runtime-error", id: null }, "*");
  } catch (_) {}
});

window.addEventListener("error", (evt) => {
  sendError(evt.error);
});

window.addEventListener("unhandledrejection", (evt) => {
  sendError(evt.reason);
});
</script>

.search-box{position:relative;display:flex;align-items:center}
.search-input{background:linear-gradient(50deg,rgba(39,0,255,0),#222);height:40px;padding:0 110px 0 18px;color:#fff;transition:all .55s;border-radius:60px;border:1.5px solid #fff;font-family:'Poppins',sans-serif;font-size:13px;width:280px;outline:none}

.search-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:2px}.search-btn{background:transparent;border:none;cursor:pointer;color:#f00;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s}.search-btn:hover{background:rgba(255,0,0,.15)}.voice-search-btn{background:transparent;border:none;cursor:pointer;color:rgba(255,255,255,.7);width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:all .2s}.voice-search-btn:hover{color:#fff;background:rgba(255,255,255,.12)}.voice-search-btn.listening{color:#f00;animation:voicePulse .8s ease infinite}@keyframes voicePulse{0%,100%{opacity:1}50%{opacity:.35}}

.se-arrow:hover{background:#334155;color:#fff}
.se-divider{width:1px;height:28px;background:rgba(255,255,255,.15);margin:0 8px}
.se-play-btn{height:32px;padding:0 14px;background:linear-gradient(135deg,#f00,#c00);border:none;color:#fff;border-radius:6px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-left:6px;white-space:nowrap}
.ep-nav-bar{display:none;align-items:center;justify-content:center;gap:10px;padding:6px 20px;background:#060a12;border-bottom:1px solid #1e293b}
.ep-nav-bar.show{display:flex}
.ep-nav-btn{height:28px;padding:0 12px;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:5px;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.ep-nav-btn:hover{background:#f00;color:#fff;border-color:#f00}
.ep-nav-now{color:#64748b;font-size:11px;font-weight:600}
#dv-info-section{display:flex;gap:24px;padding:24px 28px 16px;align-items:flex-start}
.dv-poster-wrap{flex-shrink:0;width:120px}
.dv-poster-wrap img{width:100%;height:180px;object-fit:cover;border-radius:10px;box-shadow:0 8px 32px rgba(0,0,0,.6);border:2px solid rgba(255,0,0,.25)}
#dv-info-right{flex:1;min-width:0}
.dv-title{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.2;color:#f1f5f9}
.dv-meta-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.dv-genre{color:#f99;font-weight:600}.dv-meta{color:#94a3b8}.dv-dot{color:#475569;font-size:10px}.dv-imdb{color:#fbbf24;font-weight:700}
.dv-action-row{display:flex;gap:6px;margin-top:8px;flex-wrap:nowrap;align-items:center}
.dv-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:6px 11px;border-radius:18px;font-size:11px;font-weight:700;cursor:pointer;border:none;font-family:inherit;white-space:nowrap;transition:all .2s;letter-spacing:.2px;flex-shrink:0}
.dv-btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-trailer{background:linear-gradient(135deg,#f44,#c00);color:#fff;box-shadow:0 3px 10px rgba(220,38,38,.4)}
.btn-share{width:32px;height:32px;padding:0;border-radius:50%;background:rgba(255,255,255,.1);color:#e2e8f0;border:1px solid rgba(255,255,255,.22)!important;backdrop-filter:blur(8px)}
.btn-download{background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;box-shadow:0 3px 10px rgba(22,163,74,.35)}
.btn-download:disabled{opacity:.38;cursor:not-allowed}
.adm-edit-btn{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(251,191,36,.12);border:1.5px solid rgba(251,191,36,.35);border-radius:6px;color:#fbbf24;font-family:'Poppins',sans-serif;font-size:11px;font-weight:600;cursor:pointer}
.adm-edit-btn:hover{background:rgba(251,191,36,.25)}
.dv-divider{height:1px;background:linear-gradient(to right,transparent,#1e293b 20%,#1e293b 80%,transparent);margin:8px 28px 16px}
.dv-plot{font-size:14px;line-height:1.8;color:#94a3b8;padding:0 28px 16px}
#dv-cast-section{padding:28px 28px 48px}
#dv-cast-section h2{font-size:18px;font-weight:700;color:#f1f5f9;margin-bottom:20px}
.cast-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:14px}
.cast-card{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;border-radius:10px;overflow:hidden;background:#111827;transition:transform .22s,box-shadow .22s;border:1px solid rgba(255,255,255,.04)}
.cast-card:hover{transform:translateY(-6px);box-shadow:0 16px 36px rgba(0,0,0,.7)}
.cast-img-wrap{width:100%;aspect-ratio:2/3;overflow:hidden;background:#1e293b}
.cast-img-wrap img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;transition:transform .35s}
.cast-card:hover .cast-img-wrap img{transform:scale(1.07)}
.cast-name{font-size:11px;font-weight:700;color:#e2e8f0;padding:7px 7px 2px;line-height:1.3}
.cast-role{font-size:10px;color:#f99;font-weight:500;padding:0 7px 9px}
/* PERSON VIEW */
#person-view{position:fixed;inset:0;z-index:9500;background:#070d1a;overflow-y:auto;overflow-x:hidden;color:#e2e8f0;display:none}
#person-view.open{display:block}
.person-close-btn{position:fixed;top:16px;right:16px;z-index:9600;width:40px;height:40px;border-radius:50%;background:rgba(15,23,42,.95);border:1.5px solid rgba(255,255,255,.2);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.person-close-btn:hover{background:#ef4444}
.person-hero{display:flex;gap:22px;padding:24px 20px 18px;align-items:flex-start;background:linear-gradient(180deg,rgba(255,0,0,.08),transparent)}
.person-photo{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,0,0,.4);flex-shrink:0}
.person-name{font-size:22px;font-weight:800;color:#f1f5f9;margin-bottom:4px}
.person-dept{display:inline-block;background:rgba(255,0,0,.18);color:#f99;border:1px solid rgba(255,0,0,.3);padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-bottom:10px}
.person-bio{font-size:13px;line-height:1.75;color:#94a3b8;padding:0 20px 18px}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.people-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;cursor:pointer;transition:background .2s,transform .2s}
.people-card:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.people-card-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,0,0,.35);flex-shrink:0;background:#1e293b}
.people-card-info{min-width:0}
.people-card-name{font-size:13px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.people-card-known{font-size:11px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person-works-header{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 12px}
.person-works-count{font-size:12px;color:#64748b;font-weight:500}
.person-works{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;padding:14px 20px 40px}
/* RESPONSIVE */
@media(max-width:900px){.posts-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:600px){.posts-grid{grid-template-columns:repeat(3,1fr)}.break-text{display:none}.header-wrapper{display:flex;flex-direction:column;align-items:center;height:auto;padding:14px 16px;gap:10px}.logo-text{height:auto;width:100%;justify-content:center}.menu-nav{height:auto;justify-content:center;flex-wrap:wrap;gap:5px}.menu-nav li a{padding:.4em 1em;font-size:10px}#header-search{width:100%;justify-content:center}.search-box{width:100%}.search-input{width:100%;max-width:100%;padding:0 80px 0 14px}.search-input:focus{width:100%}}
@media(max-width:400px){.posts-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.dv-action-row{gap:4px;flex-wrap:nowrap}.dv-btn{padding:5px 9px;font-size:10px;gap:3px;letter-spacing:0}.btn-share{width:28px;height:28px}.dv-btn svg{flex-shrink:0}}
.cast-no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1e293b}
.cast-no-img svg{opacity:.5}
/* DETAIL TRANSITION OVERLAY */
#detail-transition{position:fixed;inset:0;z-index:9998;background:rgba(10,10,15,.85);opacity:0;pointer-events:none;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);transition:opacity .5s ease,backdrop-filter .6s ease,-webkit-backdrop-filter .6s ease}
#detail-transition.active{opacity:1;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);pointer-events:all}
#detail-transition.fade-out{opacity:0;backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);pointer-events:none;transition:opacity .6s ease,backdrop-filter .7s ease,-webkit-backdrop-filter .7s ease}
#detail-transition .dt-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.dt-spinner{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.75);border-right-color:rgba(220,38,38,.6);animation:dtSpin 1s linear infinite;opacity:0;transition:opacity .4s ease}
#detail-transition.active .dt-spinner{opacity:1}
@keyframes dtSpin{to{transform:rotate(360deg)}}
/* LIVE TV */
@keyframes pulse-dot{0%{background:#e02020;box-shadow:0 0 3px 1px rgba(224,32,32,.6)}50%{background:#22c55e;box-shadow:0 0 3px 1px rgba(34,197,94,.6)}100%{background:#e02020;box-shadow:0 0 3px 1px rgba(224,32,32,.6)}}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e02020;animation:pulse-dot 1.6s ease-in-out infinite;flex-shrink:0}
#livetv-section{display:none;width:100%;height:calc(100vh - 127px);background:#111827}
#livetv-section iframe{width:100%;height:100%;border:none;display:block}
/* SEARCH SUGGESTIONS */
.search-suggest{position:absolute;top:calc(100% + 8px);right:0;width:380px;max-width:92vw;background:#111827;border:1px solid #1e293b;border-radius:10px;z-index:10000;box-shadow:0 12px 40px rgba(0,0,0,.85);display:none;max-height:440px;overflow-y:auto}
.search-suggest.show{display:block}
.sug-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04)}
.sug-item:last-child{border-bottom:none}
.sug-item:hover,.sug-item.focused{background:rgba(255,255,255,.07)}
.sug-poster{width:34px;height:50px;object-fit:cover;border-radius:4px;flex-shrink:0;background:#1e293b}
.sug-photo{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#1e293b;border:1.5px solid rgba(255,0,0,.35)}
.sug-info{flex:1;min-width:0}
.sug-title{font-size:12px;font-weight:700;color:#f1f5f9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug-meta{font-size:10px;color:#64748b;margin-top:1px;display:flex;align-items:center;gap:4px}
.sug-type{font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;text-transform:uppercase;color:#fff}
.sug-divider{padding:5px 12px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:.8px;background:rgba(0,0,0,.3)}

    <div class="social-icons">

      <a href="#" title="Instagram"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
    </div>
  </div>
</div>

<!-- HEADER -->
<div id="main-header">
  <div class="header-wrapper">
    <span class="logo-text" onclick="location.reload()">
      <span class="logo-inner">G<img class="logo-img" src="https://i.postimg.cc/SshGJbvh/apple-touch-icon.png" alt="o">&nbsp;TO CINEMA<span class="logo-tld">.net</span></span>
    </span>
    <nav><ul class="menu-nav" id="menu-nav">
      <li><a id="tab-movie" class="active" onclick="window.scrollTo({top:0,behavior:'smooth'});loadTab('movie')">Movies</a></li>
      <li><a id="tab-tv" onclick="window.scrollTo({top:0,behavior:'smooth'});loadTab('tv')">TV Shows</a></li>
      <li><a id="tab-anime" onclick="window.scrollTo({top:0,behavior:'smooth'});loadTab('anime')">Anime</a></li>
      <li><a id="tab-livetv" onclick="loadTab('livetv')" style="display:flex;align-items:center;gap:5px"><span class="live-dot"></span>Live TV</a></li>
    </ul></nav>
    <div id="header-search">
      <div class="search-box">
        <input type="text" class="search-input" id="search-input" placeholder="Search movies, shows, anime...">
        <div class="search-actions">
          <button class="search-btn" id="search-btn" title="Search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
          <button class="voice-search-btn" id="voice-search-btn" title="Voice Search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
          <button class="adv-toggle-btn" id="adv-toggle-btn" title="Advanced Filter"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADV SEARCH -->
<div id="adv-bar">
  <div id="adv-inner">
    <div class="adv-row">
      <select id="adv-type"><option value="movie">Movie</option><option value="tv">TV Show</option><option value="anime">Anime</option></select>
      <div class="lang-wrap">
        <input type="text" class="lang-search" id="lang-search" placeholder="Any Language" autocomplete="off">
        <div class="lang-list" id="lang-list"></div>
      </div>
      <select id="adv-genre"><option value="">Any Genre</option></select>
    </div>
    <div class="adv-row">
      <select id="adv-sort"><option value="popularity.desc">Popular</option><option value="vote_average.desc">Top Rated</option><option value="release_date.desc">Newest</option><option value="release_date.asc">Oldest</option></select>
      <input type="number" class="adv-year" id="adv-year" placeholder="Year e.g. 2024" min="1900" max="2030">
      <button id="adv-discover"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg> Discover</button>
    </div>
  </div>
</div>

<!-- LIVE TV SECTION -->
<div id="livetv-section"><iframe id="livetv-iframe" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture; microphone; camera"></iframe></div>

<!-- FEATURED -->
<div id="featured-wrapper">
  <div class="featured-post">
    <h2>Top Of The Week</h2>
    <div class="heading-underline"></div>
    <div class="featured-scroller" id="feat-scroller">
      <div id="feat-track"></div>
    </div>
  </div>
</div>

<!-- PEOPLE SEARCH RESULTS -->
<div id="people-section" style="display:none;padding:0 18px 8px">
  <h3 id="people-section-title" style="font-size:13px;font-weight:700;color:#94a3b8;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px"></h3>
  <div id="people-grid" class="people-grid"></div>
</div>

<!-- MAIN GRID -->
<div id="outer-wrapper">
  <h2 class="section-heading" id="section-title">Movies</h2>
  <div class="posts-grid" id="posts-grid"></div>
  <div id="load-more-spinner" style="text-align:center;padding:20px;color:#aaa;display:none">&#x23F3; Loading more...</div>
  <div id="load-trigger" style="height:10px"></div>
</div>

<!-- SCROLL TOP -->
<button class="scroll-top-btn" id="scroll-top-btn">&#x2191;</button>

<!-- DETAIL TRANSITION OVERLAY -->
<div id="detail-transition"><div class="dt-inner"><div class="dt-spinner"></div></div></div>

<!-- ADMIN LOGIN BTN -->
<button class="admin-login-btn" id="admin-login-btn" title="Login / Sign Up">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
</button>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-box">
    <button class="auth-close-btn" id="auth-close-btn">&#x2715;</button>
    <div class="auth-title">&#x1F3AC; Go To Cinema</div>
    <div class="auth-sub">Your account</div>
    <div id="auth-form-wrap">
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login-btn">Sign In</button>
        <button class="auth-tab-btn" id="tab-signup-btn">Sign Up</button>
      </div>
      <input type="text" class="auth-input" id="auth-name-input" placeholder="Full name" style="display:none">
      <input type="email" class="auth-input" id="auth-email-input" placeholder="Email address">
      <input type="password" class="auth-input" id="auth-pass-input" placeholder="Password">
      <button class="auth-submit" id="auth-submit-btn">Sign In</button>
      <div class="auth-msg" id="auth-msg"></div>
    </div>
    <div id="auth-user-panel" style="display:none">
      <div style="text-align:center;padding:8px 0 10px">
        <div class="auth-avatar-ring" id="auth-avatar"></div>
        <div id="auth-user-role" style="font-size:12px;font-weight:700;margin-bottom:3px"></div>
        <div id="auth-user-name" style="color:#ccc;font-size:12px;margin-bottom:2px"></div>
        <div id="auth-user-email" style="color:#555;font-size:11px"></div>
      </div>
      <button class="auth-logout-btn" id="auth-logout-btn">Sign Out</button>
    </div>
  </div>
</div>

<!-- ADMIN URL EDIT POPUP -->
<div class="aurl-overlay" id="aurl-overlay">
  <div class="aurl-box">
    <button class="aurl-close" id="aurl-close">&#x2715;</button>
    <div class="aurl-title" id="aurl-title">Edit URL</div>
    <div class="aurl-hint" id="aurl-hint"></div>
    <input type="text" class="aurl-input" id="aurl-input" placeholder="https://...">
    <div class="aurl-actions">
      <button class="aurl-save" id="aurl-save">&#x2713; Save</button>
      <button class="aurl-clear" id="aurl-clear">&#x1F5D1; Clear</button>
    </div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div id="detail-view">
  <div class="dv-top-bar">
    <span class="dv-top-title" id="dv-top-title"></span>
    <button class="dv-close-btn" id="dv-close-btn">&#x2715;</button>
  </div>
  <div id="dv-player-section">
    <div id="dv-player-placeholder">
      <img id="dv-backdrop" class="dv-placeholder-backdrop" src="" alt="">
      <div class="dv-placeholder-inner">
        <div class="dv-play-circle" id="dv-play-circle">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="#ff6666"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </div>
        <div class="pt">Click Watch Now to start streaming</div>
        <div class="ps" id="dv-placeholder-title"></div>
      </div>
    </div>
    <div id="dv-player-wrap"><iframe id="dv-iframe" allowfullscreen allow="autoplay; fullscreen" title="Player" src=""></iframe></div>
  </div>
  <div class="ep-nav-bar" id="ep-nav-bar">
    <button class="ep-nav-btn" id="ep-prev-btn">&#x25C4; Prev Ep</button>
    <span class="ep-nav-now" id="ep-nav-now"></span>
    <button class="ep-nav-btn" id="ep-next-btn">Next Ep &#x25BA;</button>
  </div>
  <div class="player-sources" id="player-sources"></div>
  <div class="tv-se-bar" id="tv-se-bar">
    <div class="se-inner">
      <div class="se-lbl se-season-part">S</div>
      <div class="se-total se-season-part" id="se-total-s">&#x2014;</div>
      <input type="text" inputmode="numeric" class="se-num se-season-part" id="tv-season-input" value="1">
      <div class="se-arrows se-season-part">
        <button class="se-arrow" id="s-up">&#x25B2;</button>
        <button class="se-arrow" id="s-down">&#x25BC;</button>
      </div>
      <div class="se-divider se-season-part"></div>
      <div class="se-lbl">E</div>
      <div class="se-total" id="se-total-e">&#x2014;</div>
      <input type="text" inputmode="numeric" class="se-num" id="tv-ep-input" value="1">
      <div class="se-arrows">
        <button class="se-arrow" id="e-up">&#x25B2;</button>
        <button class="se-arrow" id="e-down">&#x25BC;</button>
      </div>
      <button class="se-play-btn" id="se-play-btn">&#x25BA; Play</button>
    </div>
  </div>
  <div id="dv-info-section">
    <div class="dv-poster-wrap"><img id="dv-poster" src="" alt="" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22300%22%3E%3Crect width=%22200%22 height=%22300%22 fill=%22%231a1a2e%22/%3E%3C/svg%3E'"></div>
    <div id="dv-info-right">
      <div class="dv-title" id="dv-title"></div>
      <div class="dv-meta-row" id="dv-meta-row"></div>
      <div class="dv-action-row" id="dv-action-row"></div>
    </div>
  </div>
  <div class="dv-divider"></div>
  <p class="dv-plot" id="dv-plot"></p>
  <div class="dv-divider"></div>
  <div id="dv-cast-section" style="display:none">
    <h2>Cast</h2>
    <div class="cast-grid" id="cast-grid"></div>
  </div>
</div>

function normalizeEmbed(raw){
  const t=(raw||'').trim();if(!t)return'';
  if(/^[a-zA-Z0-9_-]{11}$/.test(t))return`https://www.youtube.com/embed/${t}?autoplay=1`;
  const yt=t.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt)return`https://www.youtube.com/embed/${yt[1]}?autoplay=1`;
  if(/youtube\.com\/embed\//.test(t))return t.includes('autoplay')?t:`${t}${t.includes('?')?'&':'?'}autoplay=1`;
  const gd=t.match(/drive\.google\.com\/file\/d\/([^/?#]+)/);
  if(gd)return`https://drive.google.com/file/d/${gd[1]}/preview`;
  const ar=t.match(/archive\.org\/details\/([^/?#]+)/);
  if(ar)return`https://archive.org/embed/${ar[1]}`;
  return t;
}

async function tmdb(ep,params={}){
  const u=new URL(`https://api.themoviedb.org/3${ep}`);
  u.searchParams.set('api_key',TMDB_KEY);
  Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));
  const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();
}

// ── ANILIST API ───────────────────────────────────────────────────────────────
const ANILIST_Q=`query($page:Int,$perPage:Int,$sort:[MediaSort]){Page(page:$page,perPage:$perPage){pageInfo{hasNextPage}media(type:ANIME,sort:$sort,isAdult:false){id idMal title{romaji english}coverImage{large}averageScore startDate{year month day}format description(asHtml:false)episodes}}}`;
async function fetchAniList(variables){
  const r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query:ANILIST_Q,variables})});
  if(!r.ok)throw new Error(r.status);
  const d=await r.json();return d.data?.Page?.media||[];
}
function anilistToItem(m){
  const isMovie=m.format==='MOVIE';
  const title=m.title?.english||m.title?.romaji||'Unknown';
  const sd=m.startDate||{};
  const date=sd.year?`${sd.year}-${String(sd.month||1).padStart(2,'0')}-${String(sd.day||1).padStart(2,'0')}`:'';
  if(isMovie){
    // Anime MOVIE → treat exactly like a regular movie
    return {id:m.id,idMal:m.idMal||null,title,release_date:date,vote_average:m.averageScore?+(m.averageScore/10).toFixed(1):0,poster_path:m.coverImage?.large||null,overview:(m.description||'').replace(/<[^>]+>/g,'').replace(/&[a-z]+;/gi,''),contentType:'movie'};
  }
  // Anime TV/ONA/OVA etc. → anime contentType (single dedicated player)
  return {id:m.id,idMal:m.idMal||null,name:title,first_air_date:date,vote_average:m.averageScore?+(m.averageScore/10).toFixed(1):0,poster_path:m.coverImage?.large||null,overview:(m.description||'').replace(/<[^>]+>/g,'').replace(/&[a-z]+;/gi,''),contentType:'anime'};
}

async function saveUrl(ct,id,type,val){

  const normalized=type==='player'?normalizeEmbed(val):val;
  const key=type==='player'?'playerUrl':'downloadUrl';

  else{await ref.update({[key]:firebase.firestore.FieldValue.delete()}).catch(()=>{});}
  if(type==='player')currentPlUrl=normalized;else currentDlUrl=normalized;
  rebuildActionRow();
}

// ── TMDB FETCH ───────────────────────────────────────────────────────────────
async function fetchPage(type,page){
  let d;
  if(type==='movie'){d=await tmdb('/movie/popular',{page});return d.results.map(r=>({...r,contentType:'movie'}))}
  if(type==='tv'){d=await tmdb('/tv/popular',{page});return d.results.map(r=>({...r,contentType:'tv'}))}
  // AniList: page1=trending, page2=new releases, page3+=popular
  const sortMap={1:['TRENDING_DESC'],2:['START_DATE_DESC'],3:['POPULARITY_DESC']};
  const alSort=sortMap[page]||['POPULARITY_DESC'];
  const alPage=page>3?page-2:1;
  const results=await fetchAniList({page:alPage,perPage:30,sort:alSort});
  return results.map(anilistToItem);
}

function getCached(t){return cache[t]||{items:[],lastPage:0}}
function appendCached(t,items,page){
  const c=getCached(t);const ids=new Set(c.items.map(i=>i.id));
  cache[t]={items:[...c.items,...items.filter(i=>!ids.has(i.id))],lastPage:page};
}

// ── TABS ─────────────────────────────────────────────────────────────────────
async function loadTab(type){
  currentTab=type;if(type!=='livetv')localStorage.setItem('pm_tab',type);
  discoverItems=null;discoverParams=null;discoverPage=1;displayCount=20;lastPage=0;
  ['movie','tv','anime','livetv'].forEach(t=>{
    const el=$(t==='movie'?'tab-movie':t==='tv'?'tab-tv':t==='anime'?'tab-anime':'tab-livetv');
    if(el)el.classList.toggle('active',t===type);
  });
  const isLiveTv=type==='livetv';
  const advEl=document.getElementById('adv-bar');
  const featEl=document.getElementById('featured-wrapper');
  const outerEl=document.getElementById('outer-wrapper');
  const lts=$('livetv-section');
  if(isLiveTv){
    if(advEl)advEl.style.display='none';
    if(featEl)featEl.style.display='none';
    if(outerEl)outerEl.style.display='none';
    lts.style.display='block';
    window.scrollTo(0,0);
    const ifr=$('livetv-iframe');
    if(ifr&&!ifr.src.includes('livetv.html'))ifr.src='/livetv.html';
    showLoading(false);return;
  }else{
    if(advEl)advEl.style.display='';
    if(featEl)featEl.style.display='';
    if(outerEl)outerEl.style.display='';
    lts.style.display='none';
    const ifr=$('livetv-iframe');if(ifr)ifr.src='about:blank';
  }
  const titles={movie:'Movies',tv:'TV Shows',anime:'Anime'};
  $('section-title').textContent=titles[type]||type;
  showLoading(true);
  const cached=getCached(type);
  if(cached.items.length>=60){allItems=cached.items;lastPage=cached.lastPage;renderGrid();showLoading(false);loadFeatured();return}
  try{
    const [p1,p2,p3]=await Promise.all([fetchPage(type,1),fetchPage(type,2),fetchPage(type,3)]);
    appendCached(type,[...p1,...p2,...p3],3);
    allItems=getCached(type).items;lastPage=3;
  }catch(e){}
  renderGrid();showLoading(false);loadFeatured();
}

// ── FEATURED CAROUSEL ────────────────────────────────────────────────────────
function loadFeatured(){
  const featItems=allItems.slice(0,20);
  const track=$('feat-track');track.innerHTML='';
  [...featItems,...featItems].forEach((item,i)=>{
    const realIdx=i%featItems.length;
    const div=document.createElement('div');div.className='feat-card';
    div.innerHTML=`<div class="thumb-wrap"><img src="${imgUrl(item.poster_path,'w300')}" alt="" loading="lazy" onerror="this.src='${PH}'"><span class="card-label" style="background:${typeBg(item)}">${typeLabel(item)}</span>${item.vote_average?`<span class="card-rating-badge">\u2605 ${item.vote_average.toFixed(1)}</span>`:''}</div><div class="card-body"><div class="card-title">${getTitle(item)}</div><div class="card-meta">${getYear(item)}</div></div>`;
    div.onclick=()=>{if(!carDragMoved)triggerDetailTransition(featItems[realIdx])};
    track.appendChild(div);
  });
  startCarousel();
}

let carRaf=null,carPaused=false,carDrag=false,carLastTs=null,carDragMoved=false;
function startCarousel(){
  if(carRaf)cancelAnimationFrame(carRaf);
  const sc=$('feat-scroller');
  const SPEED=window.innerWidth<=720?0.04:0.07;
  let dragStartX=0,dragStartScroll=0;
  const tick=ts=>{
    if(carLastTs===null)carLastTs=ts;
    const dt=ts-carLastTs;carLastTs=ts;
    if(!carPaused&&!carDrag){
      sc.scrollLeft+=SPEED*dt;
      const half=sc.scrollWidth/2;
      if(sc.scrollLeft>=half)sc.scrollLeft-=half;
    }
    carRaf=requestAnimationFrame(tick);
  };
  carRaf=requestAnimationFrame(tick);
  sc.onmouseenter=()=>carPaused=true;
  sc.onmouseleave=()=>{if(!carDrag)carPaused=false};
  sc.onmousedown=e=>{carDrag=true;carDragMoved=false;dragStartX=e.pageX;dragStartScroll=sc.scrollLeft;sc.classList.add('grabbing');e.preventDefault()};
  window.onmouseup=()=>{if(!carDrag)return;carDrag=false;sc.classList.remove('grabbing');carPaused=sc.matches(':hover');setTimeout(()=>{carDragMoved=false},0)};
  window.onmousemove=e=>{
    if(!carDrag)return;
    if(Math.abs(e.pageX-dragStartX)>5)carDragMoved=true;
    let n=dragStartScroll-(e.pageX-dragStartX);
    const half=sc.scrollWidth/2;if(n>=half)n-=half;if(n<0)n+=half;
    sc.scrollLeft=n;
  };
}

// ── INFINITE SCROLL ──────────────────────────────────────────────────────────────────────────────
const obs=new IntersectionObserver(async entries=>{
  if(!entries[0].isIntersecting||fetching)return;
  const source=discoverItems||allItems;
  if(displayCount<source.length){displayCount=Math.min(displayCount+20,source.length);renderGrid();return}
  if(discoverParams){
    fetching=true;$('load-more-spinner').style.display='block';
    discoverPage++;
    try{
      const d=await tmdb(discoverParams.ep,{...discoverParams.params,page:discoverPage});
      const newItems=(d.results||[]).map(r=>({...r,contentType:discoverParams.ct}));
      if(newItems.length){
        const ids=new Set(discoverItems.map(i=>String(i.id)));
        discoverItems=[...discoverItems,...newItems.filter(i=>!ids.has(String(i.id)))];
        displayCount=Math.min(displayCount+20,discoverItems.length);
        renderGrid();
      }
    }catch(e){}
    fetching=false;$('load-more-spinner').style.display='none';
    return;
  }
  if(allItems.length>=500)return;
  fetching=true;$('load-more-spinner').style.display='block';
  const next=lastPage+1;
  try{const ni=await fetchPage(currentTab,next);appendCached(currentTab,ni,next);allItems=getCached(currentTab).items;lastPage=next;displayCount=Math.min(displayCount+20,allItems.length);renderGrid();}catch{}
  fetching=false;$('load-more-spinner').style.display='none';
},{rootMargin:'500px'});
obs.observe($('load-trigger'));

// ── LIVE SEARCH SUGGESTIONS ────────────────────────────────────────────────────────────────────
const suggestEl=(function(){
  const inp=$('search-input');
  const sug=document.createElement('div');

  inp.closest('.search-box').appendChild(sug);return sug;

function hideSuggest(){suggestEl.classList.remove('show');}
(function(){
  const inp=$('search-input'),sug=suggestEl;
  let sugTimer=null,sugIdx=-1,lastSugQ='';
  const PH_SQ='https://placehold.co/34x50/111827/333';
  const AVPH_SQ='https://placehold.co/34x34/111827/333';
  async function fetchSuggestions(q){
    if(!q){hideSuggest();return}
    try{
      const d=await tmdb('/search/multi',{query:q,page:1});
      const results=d.results||[];
      if(!results.length){hideSuggest();return}
      const people=results.filter(r=>r.media_type==='person').slice(0,3);
      const media=results.filter(r=>r.media_type==='movie'||r.media_type==='tv').slice(0,8);
      let html='';
      if(people.length){
        html+='<div class="sug-divider">People</div>';
        html+=people.map(p=>{
          const src=p.profile_path?`${IMG}/w92${p.profile_path}`:AVPH_SQ;
          const nm=(p.name||'').replace(/</g,'&lt;');
          const dept=p.known_for_department||'Person';
          return `<div class="sug-item" data-stype="person" data-id="${p.id}"><img class="sug-photo" src="${src}" onerror="this.src='${AVPH_SQ}'" loading="lazy"><div class="sug-info"><div class="sug-title">${nm}</div><div class="sug-meta">${dept}</div></div></div>`;
        }).join('');
      }
      if(media.length){
        if(people.length)html+='<div class="sug-divider">Movies &amp; Shows</div>';
        html+=media.map(r=>{
          const ct=r.media_type==='tv'?'tv':'movie';
          const src=r.poster_path?`${IMG}/w92${r.poster_path}`:PH_SQ;
          const yr=(r.release_date||r.first_air_date||'').slice(0,4);
          const bg=typeBg(ct);const lbl=ct==='tv'?'TV':'MOVIE';
          const stitle=r.title||r.name||'';
          const disp=stitle.replace(/</g,'&lt;');
          const safe=stitle.replace(/"/g,'&quot;');
          const yrHtml=yr?'<span>'+yr+'</span>':'';
          return '<div class="sug-item" data-stype="media" data-ct="'+ct+'" data-id="'+r.id+'" data-stitle="'+safe+'"><img class="sug-poster" src="'+src+'" onerror="this.src=\''+PH_SQ+'\'" loading="lazy"><div class="sug-info"><div class="sug-title">'+disp+'</div><div class="sug-meta"><span class="sug-type" style="background:'+bg+'">'+lbl+'</span>'+yrHtml+'</div></div></div>';
        }).join('');
      }
      sug.innerHTML=html;
      sug.querySelectorAll('.sug-item').forEach(el=>{
        el.addEventListener('mousedown',e=>{
          e.preventDefault();
          if(el.dataset.stype==='person'){openPerson(parseInt(el.dataset.id));hideSuggest();inp.value='';}
          else{
            const id=parseInt(el.dataset.id),ct=el.dataset.ct,stitle=el.dataset.stitle;
            hideSuggest();inp.value='';
            const item={id,contentType:ct};
            if(ct==='tv')item.name=stitle;else item.title=stitle;
            triggerDetailTransition(item);
          }
        });
      });
      sug.classList.add('show');
    }catch(e){hideSuggest();}
  }
  inp.addEventListener('input',()=>{
    const q=inp.value.trim();clearTimeout(sugTimer);
    if(q===lastSugQ)return;lastSugQ=q;
    if(!q){hideSuggest();return}
    sugTimer=setTimeout(()=>fetchSuggestions(q),280);
  });
  inp.addEventListener('focus',()=>{if(inp.value.trim()&&sug.innerHTML.trim())sug.classList.add('show')});
  inp.addEventListener('blur',()=>setTimeout(()=>{hideSuggest();sugIdx=-1;},180));
  inp.addEventListener('keydown',e=>{
    const items=[...sug.querySelectorAll('.sug-item')];if(!items.length)return;
    if(e.key==='ArrowDown'){e.preventDefault();sugIdx=Math.min(sugIdx+1,items.length-1);items.forEach((el,i)=>el.classList.toggle('focused',i===sugIdx));}
    else if(e.key==='ArrowUp'){e.preventDefault();sugIdx=Math.max(sugIdx-1,0);items.forEach((el,i)=>el.classList.toggle('focused',i===sugIdx));}
    else if(e.key==='Escape'){hideSuggest();}
    else if(e.key==='Enter'&&sugIdx>=0&&items[sugIdx]){items[sugIdx].dispatchEvent(new MouseEvent('mousedown'));}
  });
})();

  if(!currentDetail){ps.style.display='none';return}
  if(currentDetail.contentType==='anime'){
    // Single dedicated anime player — no server buttons needed
    ps.style.display='none';
    return;
  }
  ps.style.display='flex';
  const servers=currentDetail.contentType==='tv'?TV_SERVERS:MOVIE_SERVERS;
  servers.forEach((_,i)=>{
    const srvIdx=currentDetail.contentType==='tv'?i+1:i;
    const div=document.createElement('div');
    div.className=`source-icon${activeServer===srvIdx?' active':''}`;
    div.title=`Player ${i+1}`;div.textContent=String(i+1);
    div.onclick=()=>{activeServer=srvIdx;buildPlayerSources();if($('dv-player-wrap').style.display!=='none')playServer()};
    ps.appendChild(div);
  });
  const wrap=document.createElement('div');wrap.className='custom-src-wrap';
  const cdiv=document.createElement('div');
  cdiv.className=`source-icon custom-src${activeServer==='custom'?' active':''}`;
  cdiv.title=currentPlUrl?'Custom Player':'Set Custom Player URL';
  cdiv.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>';
  cdiv.onclick=()=>{if(currentPlUrl){activeServer='custom';buildPlayerSources();setPlayer(currentPlUrl);}else if(isAdmin){openAurl('player');}};
  wrap.appendChild(cdiv);
  if(isAdmin){
    const eb=document.createElement('button');
    eb.className='custom-src-edit-btn';eb.title='Edit Custom Player URL';
    eb.innerHTML='<svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
    eb.onclick=e=>{e.stopPropagation();openAurl('player')};
    wrap.appendChild(eb);
  }
  if(isAdmin||currentPlUrl)ps.appendChild(wrap);
}

function rebuildActionRow(){
  if(!currentDetail)return;
  const row=$('dv-action-row');row.innerHTML='';
  const ct=currentDetail.contentType;
  const ctLabel=ct==='movie'?'Movie':ct==='tv'?'TV Show':'Anime';
  if(trailerKey){
    const b=document.createElement('button');b.className='dv-btn btn-trailer';
    b.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span>'+(trailerPlaying?ctLabel:'Trailer')+'</span>';
    b.onclick=watchTrailer;row.appendChild(b);
  }
  const db=document.createElement('button');db.className='dv-btn btn-download';
  db.disabled=!currentDlUrl;
  db.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download';
  db.title=currentDlUrl?'Download':'Download link not set';
  db.onclick=()=>{if(currentDlUrl)window.open(currentDlUrl,'_blank')};
  row.appendChild(db);
  if(isAdmin){
    const eb=document.createElement('button');eb.className='adm-edit-btn';
    eb.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> DL';
    eb.onclick=()=>openAurl('download');row.appendChild(eb);
  }
  const sb=document.createElement('button');sb.className='dv-btn btn-share';
  sb.title='Share';
  sb.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>';
  sb.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(location.href).catch(()=>{})};
  row.appendChild(sb);
}

async function updateSeasonEps(season){
  const s=tvSeasons.find(x=>x.season_number===season);
  totalEps=s?s.episode_count:0;
  $('se-total-e').textContent=totalEps||'\u2014';
}

function setPlayer(src){
  $('dv-player-wrap').style.display='flex';$('dv-player-placeholder').style.display='none';
  $('dv-iframe').src=src;
  if(currentDetail&&currentDetail.contentType==='anime')$('ep-nav-bar').classList.add('show');
  else $('ep-nav-bar').classList.remove('show');
}
function playServer(){
  if(!currentDetail)return;
  const id=currentDetail.id,ct=currentDetail.contentType;
  let url='';
  if(ct==='anime'){
    // Reference: cinemaos anime player with AniList ID directly
    url=`https://cinemaos.live/animeplayer/watch/${id}/${currentEp}`;
  }
  else if(ct==='tv'){const srv=TV_SERVERS[activeServer-1]||TV_SERVERS[0];url=srv.url(id,currentSeason,currentEp);}
  else{const srv=MOVIE_SERVERS[activeServer]||MOVIE_SERVERS[0];url=srv.url(id);}
  setPlayer(url);
}

$('dv-play-circle').onclick=playServer;
$('dv-player-placeholder').onclick=playServer;
$('dv-close-btn').onclick=()=>{clearDetailHash();$('detail-view').classList.remove('open');$('dv-iframe').src='';document.body.style.overflow='';document.documentElement.style.overflow=''};
$('se-play-btn').onclick=()=>{currentSeason=parseInt($('tv-season-input').value)||1;currentEp=parseInt($('tv-ep-input').value)||1;playServer()};
$('s-up').onclick=()=>{const v=parseInt($('tv-season-input').value)+1;$('tv-season-input').value=Math.min(v,tvSeasons.length||99);updateSeasonEps(parseInt($('tv-season-input').value))};
$('s-down').onclick=()=>{const v=parseInt($('tv-season-input').value)-1;$('tv-season-input').value=Math.max(v,1);updateSeasonEps(parseInt($('tv-season-input').value))};
$('e-up').onclick=()=>{const v=parseInt($('tv-ep-input').value)+1;$('tv-ep-input').value=Math.min(v,totalEps||9999)};
$('e-down').onclick=()=>{const v=parseInt($('tv-ep-input').value)-1;$('tv-ep-input').value=Math.max(v,1)};
$('tv-season-input').onchange=()=>updateSeasonEps(parseInt($('tv-season-input').value)||1);
$('ep-prev-btn').onclick=()=>{if(currentEp>1){currentEp--;$('tv-ep-input').value=currentEp;playServer()}};
$('ep-next-btn').onclick=()=>{if(!totalEps||currentEp<totalEps){currentEp++;$('tv-ep-input').value=currentEp;playServer()}};

function watchTrailer(){
  if(!trailerKey)return;
  if(!trailerPlaying){
    prevIframeSrc=$('dv-iframe').src;prevPlayerVisible=$('dv-player-wrap').style.display!=='none';
    trailerPlaying=true;setPlayer(`https://www.youtube.com/embed/${trailerKey}?autoplay=1`);
  } else {
    trailerPlaying=false;
    if(prevPlayerVisible&&prevIframeSrc){setPlayer(prevIframeSrc);}
    else{$('dv-player-wrap').style.display='none';$('dv-player-placeholder').style.display='flex';$('dv-iframe').src='';$('ep-nav-bar').classList.remove('show');}
  }
  rebuildActionRow();
}

// ── PERSON VIEW ───────────────────────────────────────────────────────────────
async function openPerson(id){
  $('person-view').classList.add('open');document.body.style.overflow='hidden';document.documentElement.style.overflow='hidden';
  $('person-hero-wrap').innerHTML='';$('person-bio').textContent='';$('person-works').innerHTML='';
  if($('person-works-count'))$('person-works-count').textContent='';
  if($('person-works-title'))$('person-works-title').textContent='Known For';
  showLoading(true);
  try{
    const [p,c]=await Promise.all([tmdb('/person/'+id),tmdb('/person/'+id+'/combined_credits')]);
    const heroImg=p.profile_path?'<img class="person-photo" src="'+IMG+'/w185'+p.profile_path+'" alt="">':'<div class="person-photo" style="background:#1e293b;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" width="52" height="52"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>';
    $('person-hero-wrap').innerHTML='<div class="person-hero">'+heroImg+'<div><div class="person-name">'+p.name+'</div>'+(p.known_for_department?'<span class="person-dept">'+p.known_for_department+'</span>':'')+'</div></div>';
    $('person-bio').textContent=p.biography?p.biography.slice(0,800)+(p.biography.length>800?'...':''):'';
    const allWorks=(c.cast||[]).filter(w=>w.media_type==='movie'||w.media_type==='tv').sort((a,b)=>(b.popularity||0)-(a.popularity||0));
    const works=allWorks.filter(w=>w.poster_path);
    window._pw=works;
    if($('person-works-title'))$('person-works-title').textContent='All Works';
    if($('person-works-count'))$('person-works-count').textContent=works.length+' titles';
    $('person-works').innerHTML=works.map(function(w,i){
      const ct=w.media_type==='movie'?'movie':'tv';
      const r=w.vote_average?w.vote_average.toFixed(1):'';
      const yr=getYear(w)?'<span>'+getYear(w)+'</span>':'';
      const badge=r?'<span class="card-rating-badge">\u2605 '+r+'</span>':'';
      return '<div class="post-card" onclick="closePerson();triggerDetailTransition(window._pw['+i+'])">'+
             '<div class="thumb-wrap"><img src="'+imgUrl(w.poster_path,'w342')+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'+
             '<span class="card-label" style="background:'+typeBg(ct)+'">'+typeLabel(ct)+'</span>'+badge+'</div>'+
             '<div class="card-body"><div class="card-title">'+getTitle(w)+'</div><div class="card-meta">'+yr+'</div></div></div>';
    }).join('');
  }catch(e){}
  showLoading(false);
}
function closePerson(){$('person-view').classList.remove('open');if(!$('detail-view').classList.contains('open')){document.body.style.overflow='';document.documentElement.style.overflow='';}}
$('person-close-btn').onclick=closePerson;

  $('posts-grid').innerHTML=Array(20).fill(0).map(()=>`<div class="skeleton-card"><div class="skel-thumb skeleton"></div><div class="skel-body"><div class="skel-line skeleton"></div><div class="skel-line short skeleton"></div></div></div>`).join('');

// ── VOICE SEARCH ─────────────────────────────────────────────────────────────
(function(){
  const vBtn=$('voice-search-btn');
  if(!vBtn)return;
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){vBtn.style.display='none';return;}
  const rec=new SR();rec.continuous=false;rec.interimResults=false;rec.lang='en-US';
  rec.onresult=e=>{const t=e.results[0][0].transcript;$('search-input').value=t;vBtn.classList.remove('listening');doSearch();};
  rec.onend=()=>vBtn.classList.remove('listening');
  rec.onerror=()=>vBtn.classList.remove('listening');
  vBtn.onclick=()=>{if(vBtn.classList.contains('listening')){rec.stop();}else{rec.start();vBtn.classList.add('listening');}};
})();

// -- DEEP LINKING ----------------------------------------------------------
function slugify(s){
  return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,'').trim().replace(/ +/g,'-').substring(0,60);
}
function setDetailHash(item){
  var slug=slugify(getTitle(item));
  var type=item.contentType;
  window.history.replaceState(null,'','#/'+type+'/'+slug+'/'+item.id);
}
function clearDetailHash(){
  window.history.replaceState(null,'',location.pathname+location.search);
}
async function openFromHash(){
  var hash=window.location.hash;
  if(!hash||hash.indexOf('#/')!==0)return;
  var parts=hash.slice(2).split('/');
  if(parts.length<3)return;
  var type=parts[0];
  var id=parseInt(parts[parts.length-1]);
  if(!id||type!=='movie'&&type!=='tv'&&type!=='anime')return;
  try{
    var item;
    if(type==='anime'){
      var q='query($id:Int){Media(id:$id,type:ANIME){id title{romaji english}coverImage{extraLarge large}averageScore startDate{year month day}format description(asHtml:false)}}';
      var r=await fetch('https://graphql.anilist.co',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,variables:{id:id}})});
      var d=await r.json();
      var m=d&&d.data&&d.data.Media;
      if(!m)return;
      var atitle=(m.title&&(m.title.english||m.title.romaji))||'';
      var sd=m.startDate||{};
      var mon=sd.month?String(sd.month).padStart(2,'0'):'01';
      var day=sd.day?String(sd.day).padStart(2,'0'):'01';
      var date=sd.year?(sd.year+'-'+mon+'-'+day):'';
      item={id:m.id,idMal:null,name:atitle,first_air_date:date,vote_average:m.averageScore?+(m.averageScore/10).toFixed(1):0,poster_path:(m.coverImage&&(m.coverImage.extraLarge||m.coverImage.large))||null,overview:(m.description||'').replace(/<[^>]+>/g,''),contentType:'anime'};
    }else{
      var d2=await tmdb('/'+type+'/'+id,{});
      if(!d2||!d2.id)return;
      item=Object.assign({},d2,{contentType:type});
    }
    openDetail(item);
  }catch(ex){}
}

// ── INIT ─────────────────────────────────────────────────────────────────────
showSkeletons();
loadTab(currentTab);
openFromHash();
